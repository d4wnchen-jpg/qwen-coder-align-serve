# QLoRA SFT 配置（LLaMA-Factory）
# 用法: llamafactory-cli train train/sft.yaml
# 基座: Qwen3-Coder-30B-A3B-Instruct（4090 24GB 可跑 4bit QLoRA）
# 备选: Qwen/Qwen3-8B-Instruct（OOM 或预算紧张时切换）

### model
model_name_or_path: Qwen/Qwen3-Coder-30B-A3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_target: all
lora_dropout: 0.05

### dataset
dataset: data/train.json          # 见 data/prepare_data.py 产出
template: qwen3
cutoff_len: 2048
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16
val_size: 0.05

### output
output_dir: outputs/sft-r64-e3
logging_steps: 10
save_steps: 200
plot_loss: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8     # 等效 batch 16
learning_rate: 2.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
packing: false

### eval
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 200

# 实验矩阵（改 lora_rank / num_train_epochs / learning_rate 后另存为 sft-r16-e2.yaml 等）:
#   r=16 alpha=32 epoch=2 lr=2e-4
#   r=64 alpha=128 epoch=2 lr=2e-4
#   r=64 alpha=128 epoch=3 lr=1e-4
