# QLoRA SFT · 矩阵组 r64-e2（lora_rank=64, epoch=2）
# 用法: llamafactory-cli train train/sft-r64-e2.yaml
# 基座: Qwen3-8B（4090 bf16 直跑）

### model
model_name_or_path: Qwen/Qwen3-8B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_target: all
lora_dropout: 0.05
gradient_checkpointing: true

### dataset
dataset: code_train
template: qwen3
cutoff_len: 2048
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16
val_size: 0.05

### output
output_dir: outputs/sft-r64-e2
logging_steps: 10
save_steps: 200
plot_loss: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
packing: false

### eval
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 200
